name: Ash Nazag image forge
on:
  pull_request:
    paths: ['etc/default/**', 'webapp/**', 'kernel/atari/**', '.github/workflows/webapp.yml']
  push:
    paths: ['etc/default/**', 'webapp/**', 'kernel/atari/**', '.github/workflows/webapp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: webapp/go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu
      - run: CROSS=m68k-linux-gnu- sh webapp/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node webapp/test-wasm.cjs
      - run: node webapp/test-image-wasm.cjs
      - run: node webapp/test-filesystem-wasm.cjs
      - run: node webapp/test-root-wasm.cjs
      - run: node webapp/test-package-wasm.cjs
      - run: node webapp/test-provision-wasm.cjs
      - run: node webapp/test-storage.cjs
      - run: node webapp/test-quadra-worker.cjs
      - uses: actions/upload-pages-artifact@v4
        if: >-
          github.repository == 'kdedon/ashnazag' && github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: webapp/build/site
  deploy:
    if: >-
      github.repository == 'kdedon/ashnazag' && github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
