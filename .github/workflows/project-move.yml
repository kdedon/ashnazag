name: Move Project Card by Label

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  move-card:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Move to "ready" if labeled 'ready'
      - name: Move to In Progress
        if: github.event.label.name == 'ready'
        uses: alex-page/github-project-automation-plus@v0.9.0
        with:
          project: 'Ash Nazag' # Exact name of your GitHub Project
          column: 'Ready'            # Name of the target lane/column
          repo-token: ${{ secrets.PROJECT_MOVE_TOKEN }}

      # Step 2: Move to "In Progress" if labeled 'in-progress'
      - name: Move to In Progress
        if: github.event.label.name == 'in-progress'
        uses: alex-page/github-project-automation-plus@v0.9.0
        with:
          project: 'Ash Nazag' # Exact name of your GitHub Project
          column: 'In Progress'            # Name of the target lane/column
          repo-token: ${{ secrets.PROJECT_MOVE_TOKEN }}

      # Step 3: Move to "In Review" if labeled 'in-review'
      - name: Move to In Review
        if: github.event.label.name == 'in-review'
        uses: alex-page/github-project-automation-plus@v0.9.0
        with:
          project: 'Ash Nazag'
          column: 'In Review'
          repo-token: ${{ secrets.PROJECT_MOVE_TOKEN }}
