name: Unstable packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unstable
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/toolchain.yml
    permissions:
      contents: read

  packages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mod.d-*
          path: mods
      - name: SVR4 packages
        run: sh images/envpkg/mkmodpkgs.sh mods pkgs
      - name: Packages only hold hardware modules
        run: |
          for f in pkgs/*.pkg; do
            case $(basename "$f") in
            mod*|cdfs*|disk*|am*|at*) ;;
            *) echo "unexpected $f"; exit 1 ;;
            esac
          done
          [ "$(ls pkgs/*.pkg | wc -l)" -ge 20 ]
      # a manual run from another branch only uploads the packages
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: pkgs
      - name: Move the unstable tag and replace the prerelease assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f unstable "$GITHUB_SHA"
          git push -f origin refs/tags/unstable
          notes=pkgs/.notes
          printf '\nCommit %s.\n' "$GITHUB_SHA" >> "$notes"
          if gh release view unstable > /dev/null 2>&1; then
            gh release edit unstable --prerelease --latest=false --target "$GITHUB_SHA" --title unstable --notes-file "$notes"
            gh release view unstable --json assets --jq '.assets[].name' |
              while read -r a; do gh release delete-asset unstable "$a" --yes; done
          else
            gh release create unstable --prerelease --latest=false --target "$GITHUB_SHA" --title unstable --notes-file "$notes"
          fi
          gh release upload unstable pkgs/*.pkg pkgs/SHA256SUMS
